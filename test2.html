    <style>

        body, html {
            overflow: hidden;
        }

        #viewport {
            position: absolute;
            contain: strict;
            border: solid 10px #ccc;
            /* overflow: hidden; */
            /* transition: all 5ms linear; */
            top: 100px;
            left: 100px;
        }

        /* ===================================== */
        .map-element {
            position: absolute;
        }

        .map-element__shadow {
            position: absolute;
            background-color: #0004;
            filter: blur(3px);
            border-radius: 8px;
            transform: skewX(8deg);
        }
        .map-element__sprite {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .map-element.character .map-element__sprite {
            will-change: transform, z-index;
            transform: scale(0.7);
        }
        .map-element.character .map-element__shadow {
            width: 24px !important;
            left: 14px !important;
        }


        /* ===================================== */

        .map-element.collided {
            background-color: #0ff8;
        }

        .map-element__bounding-box {
            position: absolute;
            outline: dotted #f0f 1px;
            height: 100%;
            width: 100%;

            background-color: #fff4;
        }

        .map-element__collision-bounding-box {
            position: absolute;
            outline: dotted #ff0 1px;
        }

        .map-element__collision-zone {
            position: absolute;
            /*outline: solid #ff0 1px;*/
            background-color: #ff08;
        }

        .map-element__collision-zone.collided {
            position: absolute;
            /*outline: solid #ff0 1px;*/
            background-color: #f0f;
        }

        .map-element__collision-zone.debug {
            position: absolute;
            outline: solid #ff0 10px;
        }

        .map-area {
            position: absolute;
            outline: dotted #f0f 1px;
        }


        #light-test {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;

            /* background-color: #fff; */

            background-color: #00a;

            z-index: 10000;
            /* border-radius: 100%; */
            /* filter: blur(20px); */

            opacity: 0.5;
            mix-blend-mode: soft-light; /*difference*/;
            mix-blend-mode: multiply;
            /* mix-blend-mode: overlay; */
            /* mix-blend-mode: luminosity; */
            /* mix-blend-mode: color-dodge; */

        }

    </style>
</head>
